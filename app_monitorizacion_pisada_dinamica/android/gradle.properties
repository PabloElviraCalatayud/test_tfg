org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Desactivado a proposito: con Flutter instalado via snap, el snap puede
# autoactualizarse en segundo plano mientras el daemon de Gradle sigue
# vivo entre builds. El daemon se queda entonces con una referencia
# obsoleta al binario/montaje anterior de "flutter" y la siguiente
# compilacion falla con "A problem occurred starting process
# '.../snap/flutter/common/flutter/bin/flutter'" -- sin relacion con el
# codigo del proyecto, solo con que el proceso de Gradle lleva vivo
# demasiado tiempo. Sin daemon persistente, cada build arranca en un
# estado limpio y no puede arrastrar ese problema (a cambio de un
# arranque de Gradle un poco mas lento en cada build).
org.gradle.daemon=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
