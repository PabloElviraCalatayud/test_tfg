name: app_monitorizacion_pisada_dinamica
description: "Gait analysis companion app for ESP32 GaitSole sensor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  flutter_blue_plus: ^1.32.3
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.1
  google_fonts: ^6.2.1
  path_drawing: ^1.0.1
  cupertino_icons: ^1.0.8

  mqtt_client: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true