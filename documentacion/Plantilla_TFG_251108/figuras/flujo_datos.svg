<rect x="250.0" y="500" width="260" height="60" fill="#fbfbfb" stroke="#2b3a55" stroke-width="1.8" rx="12"/>
<text x="380.0" y="526.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2433">UI en tiempo real</text>
<text x="380.0" y="542.0" text-anchor="middle" font-size="11" fill="#5a6472">mapas de calor, horizonte</text>
<rect x="552.5" y="503.5" width="260" height="60" fill="#000000" opacity="0.10" rx="12"/>
<rect x="550.0" y="500" width="260" height="60" fill="#fbfbfb" stroke="#2b3a55" stroke-width="1.8" rx="12"/>
<text x="680.0" y="526.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2433">SQLite local</text>
<text x="680.0" y="542.0" text-anchor="middle" font-size="11" fill="#5a6472">history_service (pasos + trazabilidad)</text>
<text x="530.0" y="455" text-anchor="middle" font-size="10.5" fill="#777">(no dependen de la nube)</text>
<line x1="1200.0" y1="430" x2="1200.0" y2="500" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowG)"/>
<rect x="1052.5" y="503.5" width="300" height="60" fill="#000000" opacity="0.10" rx="12"/>
<rect x="1050.0" y="500" width="300" height="60" fill="#fbfbfb" stroke="#2b3a55" stroke-width="1.8" rx="12"/>
<text x="1200.0" y="526.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2433">Grafana</text>
<text x="1200.0" y="542.0" text-anchor="middle" font-size="11" fill="#5a6472">visualización histórica (consultas SQL)</text>
</svg>