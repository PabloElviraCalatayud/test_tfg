<text x="77.5" y="190.0" text-anchor="middle" font-size="10.5" fill="#444">1 B</text>
<text x="77.5" y="130" text-anchor="middle" font-size="10.5" fill="#666">byte 0</text>
<rect x="117" y="143" width="71" height="76" fill="#000" opacity="0.08" rx="8"/>
<rect x="115" y="140" width="75" height="76" fill="#e6e7e9" stroke="#5a6472" stroke-width="2" rx="8"/>
