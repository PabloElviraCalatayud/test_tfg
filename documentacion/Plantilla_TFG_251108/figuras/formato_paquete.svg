<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="430" fill="#ffffff"/>
<text x="800.0" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">Formato del paquete de sensores (59 bytes, RAW)</text>
<text x="800.0" y="60" text-anchor="middle" font-size="12.5" fill="#666">25 campos int16 con signo, big-endian, ancho fijo — packet_builder.c / packet_decoder.dart</text>
