<text x="1475.8333333333335" y="455" text-anchor="middle" font-size="11.5" fill="#333">Oscilación</text>
<text x="1475.8333333333335" y="470" text-anchor="middle" font-size="11.5" fill="#333">(60–100%)</text>
<line x1="1475.8333333333335" y1="278" x2="1302.0" y2="310" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
<text x="110" y="255" font-size="12.5" font-weight="bold" fill="#333">Zonas de carga aproximadas bajo el pie en cada instante (talón / mediopié / antepié)</text>
<rect x="80" y="560" width="1540" height="330" fill="#fbfbfb" stroke="#888" stroke-width="1.5" stroke-dasharray="8,6" rx="10"/>
<text x="110" y="592" font-size="16" font-weight="bold" fill="#222">Por qué es relevante para interpretar los datos de la plantilla</text>
<text x="110" y="618" font-size="12.3" fill="#333">El patrón de presión recorrido por los 12 sensores FSR durante una zancada reproduce, en líneas generales, la secuencia de fases descrita arriba: un</text>
<text x="110" y="635" font-size="12.3" fill="#333">pico de presión en los sensores del talón en el contacto inicial, una distribución más repartida en el apoyo medio, y un desplazamiento de la carga</text>
<text x="110" y="652" font-size="12.3" fill="#333">hacia los sensores del antepié en el despegue, seguido de una caída generalizada de la presión durante toda la fase de oscilación.</text>
<text x="110" y="675" font-size="12.3" fill="#333">El algoritmo de detección de pasos implementado en este TFG (sensor_provider.dart, función _detectSteps) aprovecha precisamente esta transición: un</text>
<text x="110" y="692" font-size="12.3" fill="#333">incremento relativo brusco de la presión máxima entre dos lecturas consecutivas señala, de forma aproximada, el paso de la fase de oscilación a la</text>
<text x="110" y="709" font-size="12.3" fill="#333">fase de apoyo (contacto inicial), independientemente del nivel de precarga mecánica de reposo de cada sensor concreto.</text>
<text x="110" y="732" font-size="12.3" fill="#333">La implementación actual se limita a contar este evento; no segmenta automáticamente el resto de fases intermedias del ciclo. Una extensión posible</text>
<text x="110" y="749" font-size="12.3" fill="#333">—de naturaleza exploratoria, sin que ello implique ningún tipo de validación clínica del prototipo actual— sería emplear el patrón conjunto de los</text>
<text x="110" y="766" font-size="12.3" fill="#333">12 FSR junto con la orientación estimada por la IMU para clasificar cada fase de la marcha de forma más fina, lo que en la literatura se explora</text>
<text x="110" y="783" font-size="12.3" fill="#333">como posible apoyo al análisis de patrones de marcha asociados a determinadas condiciones clínicas o deportivas (ver Estado del Arte).</text>
<text x="110" y="806" font-size="12.3" fill="#333">La proporción aproximada 60 % apoyo / 40 % oscilación corresponde a la marcha a paso normal; varía con la velocidad del movimiento y, en la carrera,</text>
<text x="110" y="823" font-size="12.3" fill="#333">la fase de apoyo se reduce de forma notable y aparecen fases de vuelo sin ningún punto de contacto con el suelo.</text>
</svg>